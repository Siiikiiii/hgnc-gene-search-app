name: Gene Lookup CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t gene-lookup-app .

      - name: Run application
        run: docker run -d --name gene-lookup-app -p 8000:8000 gene-lookup-app

      - name: Check the application responds
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:8000 > /dev/null && exit 0
            sleep 2
          done
          docker logs gene-lookup-app
          exit 1

      - name: Run pytest with coverage
        run: |
          docker exec gene-lookup-app \
            python -m pytest \
            --cov=hgnc_app \
            --cov-report=xml \
            tests

      - name: Copy coverage report out of the container
        run: docker cp gene-lookup-app:/app/coverage.xml coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}